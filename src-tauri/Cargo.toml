[package]
name = "self-planning-workbench"
version = "1.0.0"
description = "自我规划工作台 - Tauri 桌面应用"
authors = ["you"]
edition = "2021"

[lib]
name = "self_planning_workbench_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
